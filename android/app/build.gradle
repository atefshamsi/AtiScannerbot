plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.ati.toobit'
    compileSdk 35

    defaultConfig {
        applicationId 'com.ati.toobit'
        minSdk 24
        targetSdk 35
        versionCode 4
        versionName '0.9.3'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.15.0'
}
