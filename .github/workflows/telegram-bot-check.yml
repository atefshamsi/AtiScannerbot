name: Telegram bot checks
on:
  push:
    branches: [main, telegram-bot]
  pull_request:
    branches: [main]
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check server.js
      - run: node --check telegram.js
      - run: node --check public/app.js
      - run: npm test
